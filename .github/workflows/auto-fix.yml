on:
  workflow_run:
    # Only run after the Excavator workflow completes
    workflows: [Excavator]
    types: [completed]

name: Auto-Fix Manifests

permissions:
  # auto-fix commits repaired manifests
  contents: write
  # required to read the completed excavator run's job log
  actions: read

# Ensure only one run per branch/workflow executes at a time. When a new run
# is triggered (for example by a new push), any in-progress runs in the same
# group will be cancelled so work is only performed against the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Fix Broken Manifests
    runs-on: windows-latest
    # Run on all triggers
    steps:
      - uses: actions/checkout@v7

      - name: Log trigger reason
        shell: pwsh
        run: |
          $triggerEvent = "${{ github.event_name }}"
          Write-Host "=== Auto-Fix Workflow Triggered ===" -ForegroundColor Cyan
          Write-Host "Trigger: $triggerEvent" -ForegroundColor Gray

          if ($triggerEvent -eq "workflow_run") {
            $status = "${{ github.event.workflow_run.conclusion }}"
            Write-Host "Excavator status: $status" -ForegroundColor $(if ($status -eq "failure") { "Red" } else { "Yellow" })
          }

      # The upstream ScoopInstaller/GithubActions action exposes no step outputs
      # (steps.excavator.outputs is always {}), so per-app failures are only
      # visible in the excavator job log. This workflow runs on workflow_run
      # AFTER excavator completes, so the log is final and fetchable here -
      # it is not available while that job is still in progress.
      - name: Parse excavator log for failing apps
        id: parse-logs
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            // Match the job's display name, not the job key - the API returns
            // display names, and matching 'excavate' here silently no-opped.
            const job = jobs.data.jobs.find(j => j.name === 'Check for Updates');
            if (!job) {
              console.log('Could not locate the excavator job; skipping log parse');
              core.setOutput('failed-apps', '');
              return;
            }

            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: job.id,
            });

            const text = typeof logs.data === 'string'
              ? logs.data
              : Buffer.from(logs.data).toString('utf8');

            // Excavator reports per-app failures as "<app>: <error message>",
            // e.g. "shadps4: The remote server returned an error: (404) Not Found."
            // Successful updates read "<app>: <version> (scoop version is ...)",
            // so require an explicit error phrase to avoid matching those.
            const failureRe = /^(?:\S+\s+)?([A-Za-z0-9._-]+):\s+(?=.*(?:The remote server returned an error|\b404\b|not found|failed|error))(?!.*autoupdate available).*$/gim;

            const apps = new Set();
            for (const m of text.matchAll(failureRe)) {
              apps.add(m[1]);
            }

            const list = [...apps];
            if (list.length) {
              console.log(`Apps with errors in excavator log: ${list.join(', ')}`);
            } else {
              console.log('No per-app errors found in excavator log');
            }
            core.setOutput('failed-apps', list.join(','));

      - name: Determine manifests to fix
        id: parse-errors
        shell: pwsh
        run: |
          $failedApps = "${{ steps.parse-logs.outputs.failed-apps }}"
          $excavatorResult = "${{ github.event.workflow_run.conclusion }}"

          $brokenManifests = @()
          if ($failedApps -and $failedApps.Trim() -ne '') {
            $brokenManifests = @($failedApps -split ',' | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
          }

          if ($brokenManifests.Count -gt 0) {
            Write-Host "Found $($brokenManifests.Count) broken manifest(s) to fix:" -ForegroundColor Yellow
            $brokenManifests | ForEach-Object { Write-Host "  - $_" -ForegroundColor Yellow }
            "manifests-to-fix=$($brokenManifests -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          } elseif ($excavatorResult -eq 'failure') {
            # Excavator failed outright but the log named no specific app - fall
            # back to sweeping every base manifest. Only ever on an actual failure.
            Write-Host "Excavator failed with no specific app identified - checking all base manifests" -ForegroundColor Yellow
            $brokenManifests = @(Get-ChildItem -Path "bucket" -Filter "*.json" -File | Where-Object { $_.Name -notmatch '(-nightly|-dev)' } | Select-Object -ExpandProperty BaseName)
            Write-Host "Total manifests to check: $($brokenManifests.Count)" -ForegroundColor Gray
            "manifests-to-fix=$($brokenManifests -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          } else {
            # Excavator succeeded and reported no per-app errors. Skip entirely
            # rather than sweeping every manifest - a full sweep here is expensive
            # and was never the intent.
            Write-Host "No broken manifests reported by excavator - nothing to do" -ForegroundColor Green
            "manifests-to-fix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          }

      - name: Cache Scoop
        if: steps.parse-errors.outputs.should-run == 'true'
        uses: actions/cache@v6
        id: scoop-cache
        with:
          path: ~\scoop
          key: ${{ runner.os }}-scoop-${{ hashFiles('.github/workflows/auto-fix.yml') }}
          restore-keys: |
            ${{ runner.os }}-scoop-

      - name: Install Scoop
        if: steps.parse-errors.outputs.should-run == 'true' && steps.scoop-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Install Scoop package manager
          Write-Host "Installing Scoop..." -ForegroundColor Cyan

          # Set Scoop environment variables
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:SCOOP_HOME = "$env:SCOOP\apps\scoop\current"

          # Download and install Scoop
          iex (New-Object Net.WebClient).DownloadString('https://get.scoop.sh')

          # Set environment variables for subsequent steps
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCOOP_HOME=$env:SCOOP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Scoop installed successfully" -ForegroundColor Green

      - name: Setup Scoop environment
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          # Ensure Scoop environment is set up
          if ($env:SCOOP -eq $null) {
            $env:SCOOP = "$env:USERPROFILE\scoop"
          }
          if ($env:SCOOP_HOME -eq $null) {
            $env:SCOOP_HOME = "$env:SCOOP\apps\scoop\current"
          }

          # Ensure scoop is in PATH if not already
          if ($env:PATH -notlike "*scoop*") {
            $env:PATH = "$env:SCOOP\shims;$env:PATH"
          }

          # Set environment variables for subsequent steps
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCOOP_HOME=$env:SCOOP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Dependencies
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) { scoop install 7zip }

      - name: Auto-fix broken manifests
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          $bucketPath = "${{ github.workspace }}/bucket"
          $scriptsPath = "${{ github.workspace }}/bin"
          # No manual inputs available when triggered by workflow_run from Excavator
          $manualInput = ""
          $dryRun = "false"

          # Prefer manual inputs (from workflow_dispatch) when provided, otherwise use excavator artifacts
          if ($manualInput -and $manualInput.Trim() -ne '') {
            Write-Host "Manual run requested for: $manualInput" -ForegroundColor Cyan
            $manifestsToFix = $manualInput
          } else {
            $manifestsToFix = "${{ steps.parse-errors.outputs.manifests-to-fix }}"
          }

          Write-Host "Starting auto-fix process..." -ForegroundColor Cyan
          Write-Host "SCOOP_HOME: $env:SCOOP_HOME" -ForegroundColor Gray
          Write-Host "SCOOP: $env:SCOOP" -ForegroundColor Gray

          # Determine which manifests to process
          if ($manifestsToFix) {
            Write-Host "Processing specific manifests from excavator errors..." -ForegroundColor Yellow
            $appNames = $manifestsToFix -split ','
            $manifests = Get-ChildItem -Path $bucketPath -Filter "*.json" -File |
              Where-Object { $appNames -contains $_.BaseName -and $_.Name -notmatch '(-nightly|-dev)' }
          } else {
            Write-Host "Processing all manifests..." -ForegroundColor Gray
            $manifests = Get-ChildItem -Path $bucketPath -Filter "*.json" -File |
              Where-Object { $_.Name -notmatch '(-nightly|-dev)' }
          }

          Write-Host "Found $($manifests.Count) manifests to check"

          $fixedCount = 0
          $skipped = @()
          foreach ($manifest in $manifests) {
            Write-Host "`n[$(Get-Date -Format 'HH:mm:ss')] Processing $($manifest.BaseName)..."

            # Reset before each call so a previous non-zero code can't leak forward
            $global:LASTEXITCODE = 0

            # Run auto-fix script
            $result = & "$scriptsPath\autofix-manifest.ps1" -ManifestPath $manifest.FullName -BucketPath $bucketPath

            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              Write-Host "[OK] Fixed: $($manifest.BaseName)" -ForegroundColor Green
              $fixedCount++
            } else {
              # autofix-manifest.ps1 exits non-zero when it cannot determine a safe
              # fix (e.g. unparseable checkver, or a version that looks wrong and
              # would corrupt the manifest). That is the script declining to act -
              # not a CI failure. Record it and keep going.
              Write-Host "[SKIP] $($manifest.BaseName) - no safe fix determined (exit $exitCode)" -ForegroundColor Yellow
              $skipped += $manifest.BaseName
            }
          }

          Write-Host "`n=== Auto-fix process complete ===" -ForegroundColor Cyan
          Write-Host "Fixed: $fixedCount manifest(s)" -ForegroundColor Cyan
          Write-Host "Skipped: $($skipped.Count) manifest(s)" -ForegroundColor Cyan

          # Surface the outcome in the run summary instead of via a red X
          $summary = @()
          $summary += "### Auto-fix results"
          $summary += ""
          $summary += "- Fixed: **$fixedCount**"
          $summary += "- Skipped (no safe fix): **$($skipped.Count)**"
          if ($skipped.Count -gt 0) {
            $summary += ""
            $summary += "Manifests needing manual attention:"
            $skipped | ForEach-Object { $summary += "- ``$_``" }
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

          # Unfixable manifests are reported above, not treated as a build failure.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Commit and push changes
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          git config user.name "Scoop Auto-Updater"
          git config user.email "auto-updater@scoop.sh"
          git add bucket/

          $status = git status --porcelain
          if ($status) {
            Write-Host "Found changes to commit:" -ForegroundColor Green
            Write-Host $status
            git commit -m "chore: Auto-fix broken manifests"
            git push
            Write-Host "✓ Changes pushed" -ForegroundColor Green
          } else {
            Write-Host "No manifest changes to commit" -ForegroundColor Gray
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


