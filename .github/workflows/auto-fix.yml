on:
  workflow_run:
    # Only run after the Excavator workflow completes
    workflows: [Excavator]
    types: [completed]

name: Auto-Fix Manifests

permissions:
  # auto-fix commits repaired manifests
  contents: write
  # required to read the completed excavator run's job log and dispatch a retry
  actions: write
  # required to open/close tracking issues for unfixable manifests
  issues: write

# Ensure only one run per branch/workflow executes at a time. When a new run
# is triggered (for example by a new push), any in-progress runs in the same
# group will be cancelled so work is only performed against the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Fix Broken Manifests
    runs-on: windows-latest
    # Run on all triggers
    steps:
      - uses: actions/checkout@v7

      - name: Log trigger reason
        shell: pwsh
        run: |
          $triggerEvent = "${{ github.event_name }}"
          Write-Host "=== Auto-Fix Workflow Triggered ===" -ForegroundColor Cyan
          Write-Host "Trigger: $triggerEvent" -ForegroundColor Gray

          if ($triggerEvent -eq "workflow_run") {
            $status = "${{ github.event.workflow_run.conclusion }}"
            Write-Host "Excavator status: $status" -ForegroundColor $(if ($status -eq "failure") { "Red" } else { "Yellow" })
          }

      # The upstream ScoopInstaller/GithubActions action exposes no step outputs
      # (steps.excavator.outputs is always {}), so per-app failures are only
      # visible in the excavator job log. This workflow runs on workflow_run
      # AFTER excavator completes, so the log is final and fetchable here -
      # it is not available while that job is still in progress.
      - name: Parse excavator log for failing apps
        id: parse-logs
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            // Match the job's display name, not the job key - the API returns
            // display names, and matching 'excavate' here silently no-opped.
            const job = jobs.data.jobs.find(j => j.name === 'Check for Updates');
            if (!job) {
              console.log('Could not locate the excavator job; skipping log parse');
              core.setOutput('failed-apps', '');
              core.setOutput('parsed', 'false');
              return;
            }

            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: job.id,
            });

            const text = typeof logs.data === 'string'
              ? logs.data
              : Buffer.from(logs.data).toString('utf8');

            // Excavator emits this after its update step. Without it, a
            // truncated/unavailable log must not be treated as "no failures".
            const outcome = text.match(/^AUTOFIX_EXCAVATOR_OUTCOME:\s*(success|failure)$/m);
            if (!outcome) {
              console.log('Excavator outcome marker is missing; skipping auto-fix');
              core.setOutput('failed-apps', '');
              core.setOutput('checkver-failed-apps', '');
              core.setOutput('parsed', 'false');
              return;
            }

            // Excavator reports per-app failures in various formats:
            // - "<app>: <error message>" (e.g. "shadps4: The remote server returned an error: (404) Not Found.")
            // - "<app>: couldn't match..." (e.g. "dolphin-dev: couldn't match '...' in ...")
            // - "ERROR Could not update <app>..." (e.g. "ERROR Could not update dolphin, hash for dolphin-2606a-ARM64.7z failed!")
            const apps = new Set();
            const checkverApps = new Set();

            const appColonRe = /^\s*(?:\S+\s+)?([A-Za-z0-9._-]+):\s+(?=.*(?:The remote server returned an error|\b404\b|couldn't match|not found|failed|error))(?!.*autoupdate available).*$/gim;
            for (const m of text.matchAll(appColonRe)) {
              apps.add(m[1]);
            }

            const checkverFailureRe = /^\s*(?:\S+\s+)?([A-Za-z0-9._-]+):\s+couldn't (?:match|find|retrieve)\b.*$/gim;
            for (const m of text.matchAll(checkverFailureRe)) {
              apps.add(m[1]);
              checkverApps.add(m[1]);
            }

            const errorUpdateRe = /ERROR Could not update ([A-Za-z0-9._-]+)/gim;
            for (const m of text.matchAll(errorUpdateRe)) {
              apps.add(m[1]);
            }

            const list = [...apps];
            const checkverList = [...checkverApps];
            if (list.length) {
              console.log(`Apps with errors in excavator log: ${list.join(', ')}`);
            } else {
              console.log('No per-app errors found in excavator log');
            }
            if (checkverList.length) {
              console.log(`Apps with checkver match failures: ${checkverList.join(', ')}`);
            }
            core.setOutput('failed-apps', list.join(','));
            core.setOutput('checkver-failed-apps', checkverList.join(','));
            // Signals that the list below is trustworthy. Without it, a failed
            // lookup would be indistinguishable from "nothing is broken" and the
            // reconcile step would close every open issue.
            core.setOutput('parsed', 'true');

      # An issue only auto-closes from inside autofix-manifest.ps1 if auto-fix
      # actually processes that manifest - which only happens while excavator is
      # still reporting it as broken. Once a manifest is repaired by hand it
      # drops off that list entirely, so its issue would linger forever.
      # Reconcile here: any app excavator no longer reports is healthy.
      - name: Close resolved issues
        if: >-
          github.event_name == 'workflow_run' &&
          steps.parse-logs.outputs.parsed == 'true' &&
          github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const failing = new Set(
              (process.env.FAILED_APPS || '')
                .split(',')
                .map(s => s.trim())
                .filter(Boolean)
            );

            // Not filtered by the auto-fix label: if label creation ever fails
            // the issue lands unlabelled and would become unclosable. The body
            // marker below is the authoritative key.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            // Must stay in sync with Get-IssueMarker in bin/autofix-manifest.ps1
            const markerRe = /<!--\s*autofix-app:\s*([A-Za-z0-9._-]+)\s*-->/;

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const m = (issue.body || '').match(markerRe);
              if (!m) continue;

              const app = m[1];
              if (failing.has(app)) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Excavator no longer reports an error for \`${app}\`, so this looks resolved. Closing automatically.`,
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });

              console.log(`Closed #${issue.number} - ${app} is no longer failing`);
            }
        env:
          FAILED_APPS: ${{ steps.parse-logs.outputs.failed-apps }}

      - name: Determine manifests to fix
        id: parse-errors
        shell: pwsh
        run: |
          $failedApps = "${{ steps.parse-logs.outputs.failed-apps }}"
          $excavatorResult = "${{ github.event.workflow_run.conclusion }}"

          $brokenManifests = @()
          if ($failedApps -and $failedApps.Trim() -ne '') {
            $brokenManifests = @($failedApps -split ',' | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
          }

          # A few manifests breaking at once is plausible. A large fraction of the
          # bucket breaking simultaneously is not - that is an outage, a rate
          # limit, or an API problem, and acting on it files issues against
          # perfectly healthy manifests.
          $systemicThreshold = 10

          if ($brokenManifests.Count -gt $systemicThreshold) {
            Write-Host "$($brokenManifests.Count) manifests reported failing at once - treating as systemic, not per-manifest." -ForegroundColor Yellow
            Write-Host "Skipping auto-fix so a transient outage cannot raise issues against healthy manifests." -ForegroundColor Yellow
            $brokenManifests | ForEach-Object { Write-Host "  - $_" -ForegroundColor Gray }
            "manifests-to-fix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          } elseif ($brokenManifests.Count -gt 0) {
            Write-Host "Found $($brokenManifests.Count) broken manifest(s) to fix:" -ForegroundColor Yellow
            $brokenManifests | ForEach-Object { Write-Host "  - $_" -ForegroundColor Yellow }
            "manifests-to-fix=$($brokenManifests -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          } else {
            # Nothing named, so there is nothing to act on - regardless of whether
            # excavator succeeded or failed. Deliberately NO full-bucket sweep on
            # excavator failure: that tells us nothing about which manifest is at
            # fault, and if one really is, the log parse above names it. Sweeping
            # during an outage makes every manifest look broken.
            Write-Host "No specific manifest reported as failing (excavator: $excavatorResult) - nothing to do" -ForegroundColor Green
            "manifests-to-fix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "should-run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          }

      - name: Cache Scoop
        if: steps.parse-errors.outputs.should-run == 'true'
        uses: actions/cache@v6
        id: scoop-cache
        with:
          path: ~\scoop
          key: ${{ runner.os }}-scoop-${{ hashFiles('.github/workflows/auto-fix.yml') }}
          restore-keys: |
            ${{ runner.os }}-scoop-

      - name: Install Scoop
        if: steps.parse-errors.outputs.should-run == 'true' && steps.scoop-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Install Scoop package manager
          Write-Host "Installing Scoop..." -ForegroundColor Cyan

          # Set Scoop environment variables
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:SCOOP_HOME = "$env:SCOOP\apps\scoop\current"

          # Download and install Scoop
          iex (New-Object Net.WebClient).DownloadString('https://get.scoop.sh')

          # Set environment variables for subsequent steps
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCOOP_HOME=$env:SCOOP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Scoop installed successfully" -ForegroundColor Green

      - name: Setup Scoop environment
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          # Ensure Scoop environment is set up
          if ($env:SCOOP -eq $null) {
            $env:SCOOP = "$env:USERPROFILE\scoop"
          }
          if ($env:SCOOP_HOME -eq $null) {
            $env:SCOOP_HOME = "$env:SCOOP\apps\scoop\current"
          }

          # Ensure scoop is in PATH if not already
          if ($env:PATH -notlike "*scoop*") {
            $env:PATH = "$env:SCOOP\shims;$env:PATH"
          }

          # Set environment variables for subsequent steps
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCOOP_HOME=$env:SCOOP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Dependencies
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) { scoop install 7zip }

      - name: Repair known GitHub checkver patterns
        if: steps.parse-errors.outputs.should-run == 'true' && steps.parse-logs.outputs.checkver-failed-apps != ''
        shell: pwsh
        env:
          CHECKVER_FAILED_APPS: ${{ steps.parse-logs.outputs.checkver-failed-apps }}
        run: |
          $bucketPath = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $scriptsPath = Join-Path $env:GITHUB_WORKSPACE 'bin'
          $failedApps = @($env:CHECKVER_FAILED_APPS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })

          foreach ($app in $failedApps) {
            $manifestPath = Join-Path $bucketPath "$app.json"
            if (-not (Test-Path $manifestPath -PathType Leaf)) {
              Write-Host "[SKIP] Manifest not found: $manifestPath" -ForegroundColor Yellow
              continue
            }

            $originalJson = [System.IO.File]::ReadAllText($manifestPath)
            try {
              $manifest = ConvertFrom-Json -InputObject $originalJson -AsHashtable -ErrorAction Stop
              $checkver = $manifest.checkver
              $repository = $null
              foreach ($candidate in @($checkver.github, $manifest.homepage, $checkver.url)) {
                if ($candidate -and $candidate -match 'github\.com/(?:repos/)?(?<repo>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)') {
                  $repository = $matches['repo'] -replace '\.git$', ''
                  break
                }
              }
              if (-not $repository) { throw 'Could not determine the upstream GitHub repository from the manifest' }

              $apiUrl = "https://api.github.com/repos/$repository/releases/latest"
              $release = Invoke-RestMethod -Uri $apiUrl -Headers @{
                'User-Agent' = 'scoop-emulators-autofix'
                Accept = 'application/vnd.github+json'
              } -ErrorAction Stop

              $regex = if ($checkver.regex) { [string]$checkver.regex } elseif ($checkver.re) { [string]$checkver.re } else { $null }
              $candidates = @()
              if ($release.name) {
                $candidates += [ordered]@{ source = [string]$release.name; jsonpath = '$.name' }
              }
              if ($release.tag_name) {
                $candidates += [ordered]@{ source = [string]$release.tag_name; jsonpath = '$.tag_name' }
              }
              foreach ($asset in $release.assets) {
                $escapedName = ([string]$asset.name).Replace('\', '\\').Replace("'", "\'")
                $assetPath = "$.assets[?(@.name == '$escapedName')].browser_download_url"
                if ($asset.browser_download_url) {
                  $candidates += [ordered]@{ source = [string]$asset.browser_download_url; jsonpath = $assetPath }
                }
                if ($asset.name) {
                  $candidates += [ordered]@{ source = [string]$asset.name; jsonpath = "$.assets[?(@.name == '$escapedName')].name" }
                }
              }

              $repair = $null
              $version = $null
              if ($regex) {
                foreach ($candidate in $candidates) {
                  $match = [regex]::Match($candidate.source, $regex)
                  if (-not $match.Success) { continue }

                  $version = $match.Groups['1'].Value
                  if ($checkver.replace) {
                    $version = [regex]::Replace($match.Value, $regex, [string]$checkver.replace)
                  }
                  if (-not $version) { $version = $match.Groups['version'].Value }
                  if (-not $version -or $version -notmatch '\d') { continue }

                  $repair = [ordered]@{
                    url = $apiUrl
                    jsonpath = $candidate.jsonpath
                    regex = $regex
                  }
                  if ($checkver.replace) { $repair.replace = [string]$checkver.replace }
                  break
                }
              }

              # If the old pattern no longer matches any field or asset, derive
              # a new tag pattern from the release and the manifest's existing
              # version layout. This preserves separators and versions such as
              # "10.6" -> "beta_10_6" without package-specific rules.
              if (-not $repair) {
                if (-not $release.tag_name -or -not $manifest.version) {
                  throw 'Could not derive a replacement pattern without a release tag and current version'
                }

                $tag = [string]$release.tag_name
                $tagParts = [regex]::Matches($tag, '\d+')
                $versionParts = [regex]::Matches([string]$manifest.version, '\d+')
                if ($tagParts.Count -eq 0 -or $versionParts.Count -eq 0) {
                  throw 'Release tag or current version has no numeric version components'
                }

                $tagDigits = ($tagParts | ForEach-Object { $_.Value }) -join ''
                $versionDigits = ($versionParts | ForEach-Object { $_.Value }) -join ''
                $captureValues = @()
                if ($tagParts.Count -eq $versionParts.Count) {
                  for ($i = 0; $i -lt $tagParts.Count; $i++) {
                    if ($tagParts[$i].Value -ne $versionParts[$i].Value) {
                      throw 'Release tag numeric components do not match the manifest version layout'
                    }
                    $captureValues += $tagParts[$i].Value
                  }
                } elseif ($tagParts.Count -eq 1 -and $tagDigits -eq $versionDigits) {
                  foreach ($part in $versionParts) { $captureValues += $part.Value }
                } else {
                  throw 'Could not safely map release tag numbers to the existing manifest version'
                }

                $pattern = '^'
                $replacement = [string]$manifest.version
                $offset = 0
                for ($i = 0; $i -lt $tagParts.Count; $i++) {
                  $part = $tagParts[$i]
                  $pattern += [regex]::Escape($tag.Substring($offset, $part.Index - $offset))
                  if ($tagParts.Count -eq 1 -and $captureValues.Count -gt 1) {
                    for ($captureIndex = 0; $captureIndex -lt $captureValues.Count; $captureIndex++) {
                      $capture = $captureValues[$captureIndex]
                      $pattern += "(?<v$captureIndex>\d{$($capture.Length)})"
                    }
                  } else {
                    $pattern += "(?<v$i>\d{$($part.Length)})"
                  }
                  $offset = $part.Index + $part.Length
                }
                $pattern += [regex]::Escape($tag.Substring($offset)) + '$'

                $versionParts = [regex]::Matches([string]$manifest.version, '\d+')
                for ($i = $versionParts.Count - 1; $i -ge 0; $i--) {
                  $part = $versionParts[$i]
                  $replacement = $replacement.Remove($part.Index, $part.Length).Insert($part.Index, '${v' + $i + '}')
                }
                $match = [regex]::Match($tag, $pattern)
                if (-not $match.Success) { throw 'Generated checkver pattern did not match the latest tag' }
                $version = [regex]::Replace($tag, $pattern, $replacement)
                if (-not $version -or $version -notmatch '\d') { throw "Derived version is invalid: $version" }

                $repair = [ordered]@{
                  url = $apiUrl
                  jsonpath = '$.tag_name'
                  regex = $pattern
                  replace = $replacement
                }
              }

              $manifest.checkver = $repair
              $serialized = ConvertTo-Json -InputObject $manifest -Depth 100
              $utf8NoBom = New-Object System.Text.UTF8Encoding $false
              [System.IO.File]::WriteAllText($manifestPath, $serialized + "`n", $utf8NoBom)

              $checkverOutput = & "$scriptsPath\checkver.ps1" -App $app -Dir $bucketPath 2>&1 | Out-String
              if ($checkverOutput -match '(?i)couldn''t (match|find|retrieve)|couldn''t parse') {
                throw "Scoop checkver rejected the repaired configuration: $checkverOutput"
              }
              $versionPattern = '(?m)^\s*' + [regex]::Escape($app) + ':\s*\r?\n\s*' + [regex]::Escape($version) + '(?:\s+\(scoop version|\s+autoupdate available)?\s*$'
              if ($checkverOutput -notmatch $versionPattern) {
                throw "Scoop checkver did not return the expected version $version`: $checkverOutput"
              }
              Write-Host "[OK] Repaired checkver for $app (latest version: $version)" -ForegroundColor Green
            } catch {
              $utf8NoBom = New-Object System.Text.UTF8Encoding $false
              [System.IO.File]::WriteAllText($manifestPath, $originalJson, $utf8NoBom)
              Write-Host "[WARN] Could not safely repair checkver for $app`: $($_.Exception.Message)" -ForegroundColor Yellow
            }
          }

      - name: Auto-fix broken manifests
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          $bucketPath = "${{ github.workspace }}/bucket"
          $scriptsPath = "${{ github.workspace }}/bin"
          # No manual inputs available when triggered by workflow_run from Excavator
          $manualInput = ""
          $dryRun = "false"

          # Prefer manual inputs (from workflow_dispatch) when provided, otherwise use excavator artifacts
          if ($manualInput -and $manualInput.Trim() -ne '') {
            Write-Host "Manual run requested for: $manualInput" -ForegroundColor Cyan
            $manifestsToFix = $manualInput
          } else {
            $manifestsToFix = "${{ steps.parse-errors.outputs.manifests-to-fix }}"
          }

          Write-Host "Starting auto-fix process..." -ForegroundColor Cyan
          Write-Host "SCOOP_HOME: $env:SCOOP_HOME" -ForegroundColor Gray
          Write-Host "SCOOP: $env:SCOOP" -ForegroundColor Gray

          # Determine which manifests to process
          if ($manifestsToFix) {
            Write-Host "Processing specific manifests from excavator errors..." -ForegroundColor Yellow
            $appNames = $manifestsToFix -split ','
            $manifests = Get-ChildItem -Path $bucketPath -Filter "*.json" -File |
              Where-Object { $appNames -contains $_.BaseName }
          } else {
            Write-Host "Processing all manifests..." -ForegroundColor Gray
            $manifests = Get-ChildItem -Path $bucketPath -Filter "*.json" -File |
              Where-Object { $_.Name -notmatch '(-nightly|-dev)' }
          }

          Write-Host "Found $($manifests.Count) manifests to check"

          $fixedCount = 0
          $skipped = @()
          foreach ($manifest in $manifests) {
            Write-Host "`n[$(Get-Date -Format 'HH:mm:ss')] Processing $($manifest.BaseName)..."

            # Reset before each call so a previous non-zero code can't leak forward
            $global:LASTEXITCODE = 0

            # Run auto-fix script. -AutoCreateIssues opens one deduplicated
            # tracking issue per unfixable manifest and closes it again once the
            # manifest is healthy, so persistent breakage is visible without
            # turning every hourly run red.
            $result = & "$scriptsPath\autofix-manifest.ps1" `
              -ManifestPath $manifest.FullName `
              -BucketPath $bucketPath `
              -AutoCreateIssues `
              -NotifyOnIssues `
              -IssueLog "$env:RUNNER_TEMP\autofix-issues.jsonl" `
              -GitHubToken $env:GITHUB_TOKEN `
              -GitHubRepo $env:GITHUB_REPOSITORY

            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              Write-Host "[OK] Fixed: $($manifest.BaseName)" -ForegroundColor Green
              $fixedCount++
            } else {
              # autofix-manifest.ps1 exits non-zero when it cannot determine a safe
              # fix (e.g. unparseable checkver, or a version that looks wrong and
              # would corrupt the manifest). That is the script declining to act -
              # not a CI failure. Record it and keep going.
              Write-Host "[SKIP] $($manifest.BaseName) - no safe fix determined (exit $exitCode)" -ForegroundColor Yellow
              $skipped += $manifest.BaseName
            }
          }

          Write-Host "`n=== Auto-fix process complete ===" -ForegroundColor Cyan
          Write-Host "Fixed: $fixedCount manifest(s)" -ForegroundColor Cyan
          Write-Host "Skipped: $($skipped.Count) manifest(s)" -ForegroundColor Cyan

          # Surface the outcome in the run summary instead of via a red X
          $summary = @()
          $summary += "### Auto-fix results"
          $summary += ""
          $summary += "- Fixed: **$fixedCount**"
          $summary += "- Skipped (no safe fix): **$($skipped.Count)**"
          if ($skipped.Count -gt 0) {
            $summary += ""
            $summary += "Manifests needing manual attention:"
            $skipped | ForEach-Object { $summary += "- ``$_``" }
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

          # Unfixable manifests are reported above, not treated as a build failure.
          $global:LASTEXITCODE = 0
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push changes
        id: commit-fixes
        if: steps.parse-errors.outputs.should-run == 'true'
        shell: pwsh
        run: |
          git config user.name "Scoop Auto-Updater"
          if ($LASTEXITCODE -ne 0) { throw "git config user.name failed" }
          git config user.email "auto-updater@scoop.sh"
          if ($LASTEXITCODE -ne 0) { throw "git config user.email failed" }
          git add bucket/
          if ($LASTEXITCODE -ne 0) { throw "git add failed" }

          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($status) {
            Write-Host "Found changes to commit:" -ForegroundColor Green
            Write-Host $status
            git commit -m "chore: Auto-fix broken manifests"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed; manifest fixes were not persisted" }
            "committed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "✓ Changes pushed" -ForegroundColor Green
          } else {
            "committed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No manifest changes to commit" -ForegroundColor Gray
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rerun Excavator after persisted fixes
        if: steps.commit-fixes.outputs.committed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ref = context.payload.workflow_run.head_branch;
            if (!ref || !/^[A-Za-z0-9._/-]+$/.test(ref)) {
              throw new Error(`Refusing to dispatch Excavator for invalid branch: ${ref}`);
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'excavator.yml',
              ref,
            });
            console.log(`Dispatched Excavator on ${ref} after committing manifest fixes`);
