on:
  schedule:
    # Run every hour to check for new versions
    - cron: '0 * * * *'
  workflow_dispatch:

name: Excavator

permissions:
  # excavator commits manifest updates
  contents: write

# Per-app failure detection lives in the Auto-Fix Manifests workflow, which
# runs on workflow_run after this one COMPLETES. Job logs are not available
# via the API while a job is still in progress, so it cannot be done here.

jobs:
  excavate:
    name: Check for Updates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Scoop
        uses: actions/cache@v6
        id: scoop-cache
        with:
          path: ~\scoop\cache
          key: ${{ runner.os }}-scoop-cache-v1-${{ hashFiles('.github/workflows/excavator.yml') }}

      - name: Check for new versions
        id: excavator
        uses: ScoopInstaller/GithubActions@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
