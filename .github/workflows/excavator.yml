on:
  schedule:
    # Run every hour to check for new versions
    - cron: "0 * * * *"
  workflow_dispatch:

name: Excavator

permissions:
  # excavator commits manifest updates; Auto-Fix is dispatched only for failures
  contents: write
  actions: read
  issues: write

jobs:
  excavate:
    name: Check for Updates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new versions
        id: excavator
        uses: ScoopInstaller/GithubActions@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"

      # The follow-up job parses this completed job log. Keep the marker stable
      # so it can distinguish a complete log from a failed lookup.
      - name: Record Excavator outcome for result processing
        if: always()
        shell: pwsh
        env:
          EXCAVATOR_OUTCOME: ${{ steps.excavator.outcome }}
        run: |
          Write-Host "AUTOFIX_EXCAVATOR_OUTCOME: $env:EXCAVATOR_OUTCOME"

  process-results:
    name: Detect manifest errors
    needs: excavate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Parse excavator log for failing apps
        id: parse-logs
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const job = jobs.data.jobs.find(j => j.name === 'Check for Updates');
            if (!job) {
              console.log('Could not locate the excavator job; skipping log parse');
              core.setOutput('failed-apps', '');
              core.setOutput('checkver-failed-apps', '');
              core.setOutput('parsed', 'false');
              return;
            }

            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: job.id,
            });
            const text = typeof logs.data === 'string'
              ? logs.data
              : Buffer.from(logs.data).toString('utf8');

            const outcome = text.match(/^AUTOFIX_EXCAVATOR_OUTCOME:\s*(success|failure)$/m);
            if (!outcome) {
              console.log('Excavator outcome marker is missing; skipping auto-fix');
              core.setOutput('failed-apps', '');
              core.setOutput('checkver-failed-apps', '');
              core.setOutput('parsed', 'false');
              return;
            }
            core.setOutput('excavator-outcome', outcome[1]);

            const apps = new Set();
            const checkverApps = new Set();
            const appColonRe = /^\s*(?:\S+\s+)?([A-Za-z0-9._-]+):\s+(?=.*(?:The remote server returned an error|\b404\b|couldn't match|not found|failed|\berr(?:or)?\b))(?!.*autoupdate available).*$/gim;
            for (const match of text.matchAll(appColonRe)) apps.add(match[1]);

            const checkverFailureRe = /^\s*(?:\S+\s+)?([A-Za-z0-9._-]+):\s+couldn't (?:match|find|retrieve)\b.*$/gim;
            for (const match of text.matchAll(checkverFailureRe)) {
              apps.add(match[1]);
              checkverApps.add(match[1]);
            }

            const errorUpdateRe = /\bERR(?:OR)?\s*:?\s*Could not update\s+([A-Za-z0-9._-]+)/gim;
            for (const match of text.matchAll(errorUpdateRe)) apps.add(match[1]);

            const list = [...apps];
            const checkverList = [...checkverApps];
            console.log(list.length
              ? `Apps with errors in excavator log: ${list.join(', ')}`
              : 'No per-app errors found in excavator log');
            if (checkverList.length) {
              console.log(`Apps with checkver match failures: ${checkverList.join(', ')}`);
            }
            core.setOutput('failed-apps', list.join(','));
            core.setOutput('checkver-failed-apps', checkverList.join(','));
            core.setOutput('parsed', 'true');

      - name: Close resolved issues
        if: >-
          steps.parse-logs.outputs.parsed == 'true' &&
          steps.parse-logs.outputs.excavator-outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const failing = new Set(
              (process.env.FAILED_APPS || '')
                .split(',')
                .map(s => s.trim())
                .filter(Boolean)
            );
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const markerRe = /<!--\s*autofix-app:\s*([A-Za-z0-9._-]+)\s*-->/;

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const match = (issue.body || '').match(markerRe);
              if (!match || failing.has(match[1])) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Excavator no longer reports an error for \`${match[1]}\`, so this looks resolved. Closing automatically.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed #${issue.number} - ${match[1]} is no longer failing`);
            }
        env:
          FAILED_APPS: ${{ steps.parse-logs.outputs.failed-apps }}

      - name: Determine manifests to fix
        id: parse-errors
        if: steps.parse-logs.outputs.parsed == 'true'
        uses: actions/github-script@v9
        env:
          FAILED_APPS: ${{ steps.parse-logs.outputs.failed-apps }}
        with:
          script: |
            const apps = [...new Set(
              (process.env.FAILED_APPS || '')
                .split(',')
                .map(app => app.trim())
                .filter(Boolean)
            )];

            if (apps.length > 10) {
              console.log(`${apps.length} manifests reported failing at once; treating this as systemic and skipping Auto-Fix.`);
              core.setOutput('should-run', 'false');
            } else if (apps.length > 0) {
              console.log(`Dispatching Auto-Fix for: ${apps.join(', ')}`);
              core.setOutput('manifests-to-fix', apps.join(','));
              core.setOutput('should-run', 'true');
            } else {
              console.log('No specific manifest reported as failing; nothing to dispatch.');
              core.setOutput('should-run', 'false');
            }

      - name: Dispatch Auto-Fix Manifests
        if: steps.parse-errors.outputs.should-run == 'true'
        uses: actions/github-script@v9
        env:
          MANIFESTS_TO_FIX: ${{ steps.parse-errors.outputs.manifests-to-fix }}
          CHECKVER_FAILED_APPS: ${{ steps.parse-logs.outputs.checkver-failed-apps }}
          EXCAVATOR_REF: ${{ github.ref_name }}
        with:
          script: |
            const ref = process.env.EXCAVATOR_REF;
            if (!ref || !/^[A-Za-z0-9._/-]+$/.test(ref)) {
              throw new Error(`Refusing to dispatch Auto-Fix for invalid branch: ${ref}`);
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'autofix-manifests',
              client_payload: {
                manifests_to_fix: process.env.MANIFESTS_TO_FIX,
                checkver_failed_apps: process.env.CHECKVER_FAILED_APPS || '',
                excavator_ref: ref,
              },
            });
            console.log(`Dispatched Auto-Fix Manifests for ${process.env.MANIFESTS_TO_FIX}`);
