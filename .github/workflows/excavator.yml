on:
  schedule:
    # Run every hour to check for new versions
    - cron: '0 * * * *'
  workflow_dispatch:

name: Excavator

permissions:
  # excavator commits manifest updates
  contents: write
  # required to read this run's job log for per-app error detection
  actions: read

jobs:
  excavate:
    name: Check for Updates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Scoop
        uses: actions/cache@v6
        id: scoop-cache
        with:
          path: ~\scoop
          key: ${{ runner.os }}-scoop-${{ hashFiles('.github/workflows/excavator.yml') }}
          restore-keys: |
            ${{ runner.os }}-scoop-

      - name: Setup Scoop Environment
        if: steps.scoop-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $env:SCOOP = "$env:USERPROFILE\scoop"
          $env:SCOOP_HOME = "$env:SCOOP\apps\scoop\current"
          "SCOOP=$env:SCOOP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCOOP_HOME=$env:SCOOP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH = "$env:SCOOP\shims;$env:PATH"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check for new versions
        id: excavator
        uses: ScoopInstaller/GithubActions@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'

      - name: Capture excavator output
        shell: pwsh
        run: |
          Write-Host "Excavator step outcome: ${{ steps.excavator.outcome }}" -ForegroundColor Cyan
          Write-Host "Excavator step outputs: ${{ toJson(steps.excavator.outputs) }}" -ForegroundColor Gray

      # The upstream ScoopInstaller/GithubActions action exposes no step outputs
      # (steps.excavator.outputs is always {}), so per-app failures are only
      # visible in the job log. Parse the log to find which apps actually failed.
      - name: Parse excavator log for failing apps
        id: parse-logs
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            // Match on the job's display name (`name:` below), not the job key.
            // The API returns display names - matching 'excavate' here silently
            // failed and is why log parsing was previously abandoned.
            const job = jobs.data.jobs.find(j => j.name === 'Check for Updates');
            if (!job) {
              console.log('Could not locate the excavator job; skipping log parse');
              core.setOutput('failed-apps', '');
              return;
            }

            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: job.id,
            });

            const text = typeof logs.data === 'string'
              ? logs.data
              : Buffer.from(logs.data).toString('utf8');

            // Excavator reports per-app failures as "<app>: <error message>",
            // e.g. "shadps4: The remote server returned an error: (404) Not Found."
            // Successful updates read "<app>: <version> (scoop version is ...)",
            // so require an explicit error phrase to avoid matching those.
            const failureRe = /^(?:\S+\s+)?([A-Za-z0-9._-]+):\s+(?=.*(?:The remote server returned an error|\b404\b|not found|failed|error))(?!.*autoupdate available).*$/gim;

            const apps = new Set();
            for (const m of text.matchAll(failureRe)) {
              apps.add(m[1]);
            }

            const list = [...apps];
            if (list.length) {
              console.log(`Apps with errors in excavator log: ${list.join(', ')}`);
            } else {
              console.log('No per-app errors found in excavator log');
            }
            core.setOutput('failed-apps', list.join(','));

      - name: Capture excavator errors
        id: capture-errors
        shell: pwsh
        run: |
          # Check excavator outcome and look for manifest errors
          $excavatorResult = "${{ steps.excavator.outcome }}"
          Write-Host "=== Excavator Results ===" -ForegroundColor Cyan
          Write-Host "Excavator outcome: $excavatorResult" -ForegroundColor Gray

          $brokenManifests = @()
          $hasErrors = $false

          # Always attempt to identify error manifests, regardless of overall outcome
          Write-Host "Checking for manifest errors..." -ForegroundColor Yellow

          # NOTE: Do NOT infer breakage from `git diff` / modified manifests.
          # Excavator modifying a manifest is the SUCCESS path - it means an update
          # was found and committed. Treating modified manifests as "broken" flagged
          # every successful update and sent healthy manifests to auto-fix.
          # Breakage is detected only from excavator's actual error output (below)
          # and from its step outcome.

          # Strategy 1: Use the app names parsed out of the excavator job log
          $failedApps = "${{ steps.parse-logs.outputs.failed-apps }}"
          if ($failedApps -and $failedApps.Trim() -ne '') {
            $brokenManifests = @($failedApps -split ',' | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
            Write-Host "Found $($brokenManifests.Count) app(s) with errors in the excavator log:" -ForegroundColor Yellow
            $brokenManifests | ForEach-Object { Write-Host "  - $_" -ForegroundColor Yellow }
            $hasErrors = $true
          } else {
            Write-Host "No per-app errors reported in the excavator log" -ForegroundColor Gray
          }

          # Strategy 2: Check if excavator itself failed outright
          if ($excavatorResult -eq 'failure') {
            Write-Host "Excavator step failed - likely a manifest error" -ForegroundColor Yellow
            $hasErrors = $true
          }

          if ($hasErrors) {
            # Only fall back to a full sweep when excavator failed outright and the
            # log gave us nothing specific. Never sweep on a successful run.
            if ($brokenManifests.Count -eq 0) {
              if ($excavatorResult -eq 'failure') {
                Write-Host "No specific manifests identified, will check all base manifests in auto-fix" -ForegroundColor Yellow
                $brokenManifests = @(Get-ChildItem -Path "bucket" -Filter "*.json" -File | Where-Object { $_.Name -notmatch '(-nightly|-dev)' } | Select-Object -ExpandProperty BaseName)
                Write-Host "Total manifests to check: $($brokenManifests.Count)" -ForegroundColor Gray
              } else {
                Write-Host "[OK] Nothing specific to fix" -ForegroundColor Green
                "has-errors=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
                exit 0
              }
            }

            # Save broken manifests list to file for next step
            $brokenManifests | ConvertTo-Json | Out-File -FilePath "broken-manifests.json" -Encoding UTF8
            Write-Host "Saved $($brokenManifests.Count) manifest(s) to broken-manifests.json" -ForegroundColor Green

            Write-Host "Error manifests identified:" -ForegroundColor Red
            $brokenManifests | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }

            # Output as GitHub Actions output
            "broken-manifests=$($brokenManifests -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
            "has-errors=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

            Write-Host "Manifest errors detected, will report and attempt auto-fix" -ForegroundColor Red
          } else {
            Write-Host "[OK] No manifest errors detected" -ForegroundColor Green
            "has-errors=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append
          }

      - name: Upload broken manifests list
        if: steps.capture-errors.outputs.has-errors == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: broken-manifests
          path: broken-manifests.json
          retention-days: 1
